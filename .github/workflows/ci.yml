name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Install dev tools
        run: pip install pytest ruff

      - name: Lint (ruff)
        # Includes the top-level runner scripts: they were outside the lint
        # scope, so pyflakes checks that catch real crashes (F821 undefined
        # name, F811 redefinition, duplicate dict keys) never ran on the
        # largest and most-executed files in the repo.
        run: ruff check vncompress tests scripts *.py

      - name: Run test suite
        run: pytest tests/ -v

      - name: CPU smoke test (compress end-to-end, no GPU)
        run: python scripts/smoke_test.py

      - name: Verify dataset checksums (data/benchmark/CHECKSUMS.json)
        run: python scripts/checksum_datasets.py

      # Rebuilds the canonical stream and the 90/10 document-level split from
      # the committed raw files. split_dataset.py exits non-zero if any
      # document, record id, or context ends up on both sides, so a change to
      # normalization or to the split policy that reintroduces train/eval
      # leakage fails CI instead of silently inflating a results table.
      # Rebuilds the canonical stream and the 90/10 document-level split from
      # the committed raw files, into a scratch directory. split_dataset.py
      # exits non-zero if any document, record id, or context ends up on both
      # sides, so a change to normalization or to the split policy that
      # reintroduces train/eval leakage fails CI.
      #
      # It writes to a scratch dir rather than data/processed/ because the
      # committed splits are built from records_all.jsonl (raw records PLUS
      # teacher-generated ones), which CI cannot reproduce -- it has no teacher
      # endpoint. Diffing against them would fail for the wrong reason.
      - name: Data pipeline (normalize -> verify -> split, assert no leakage)
        run: |
          python scripts/normalize_dataset.py
          python scripts/verify_dataset.py --fail-on-error
          python scripts/split_dataset.py --output-dir "$RUNNER_TEMP/split-check"

      # The committed manifest is the audit record for the dataset in this
      # commit: it must say the split it describes was clean.
      - name: Committed split manifest records a clean split
        run: |
          python - <<'PY'
          import json, sys
          with open('data/processed/split_manifest.json', encoding='utf-8') as f:
              manifest = json.load(f)
          check = manifest.get('leakage_check', {})
          if not check.get('clean'):
              sys.exit(f"committed split manifest reports leakage: {check.get('issues')}")
          print(f"manifest OK: {manifest['train']['n_records']} train / "
                f"{manifest['eval']['n_records']} eval, leakage check clean")
          PY
